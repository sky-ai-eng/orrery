name: cla

# Every person who submits work here signs the CLA in docs/contributors/CLA.md:
# whoever opens the pull request, and every author or committer of its commits
# who has a GitHub account. EXEMPT names automation and AI assistants, which
# cannot sign; what they produce is covered by the signature of the person who
# submits it. The opener is always checked because it is the one identity
# GitHub authenticates: a commit's author is an email address anyone can set.
#
# A contributor signs by commenting SIGN_PHRASE on a pull request. Signatures
# are one JSON file on the cla-signatures branch, which holds nothing else. The
# verdict is the commit status `cla` on the pull request's head, so a signature
# updates it directly, without re-running a check.
#
# pull_request_target and issue_comment run this file from the default branch
# with a write token, so the job never checks out or runs pull request code: it
# reads only metadata through the API.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (contains(github.event.comment.body, 'hereby sign the CLA') ||
        github.event.comment.body == 'recheck'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        env:
          EXEMPT: "AidanAllchin,sky-ai-bot,claude,claude[bot],triage-factory[bot],dependabot[bot],github-actions[bot]"
          SIGN_PHRASE: "I have read the CLA Document and I hereby sign the CLA"
        with:
          script: |
            const { owner, repo } = context.repo;
            const BRANCH = 'cla-signatures';
            const FILE = 'cla.json';
            const MARKER = '<!-- orrery-cla -->';
            // pulls.listCommits returns at most 250 commits.
            const MAX_COMMITS = 250;
            const exempt = new Set(process.env.EXEMPT.split(',').map((s) => s.trim().toLowerCase()));
            const phrase = process.env.SIGN_PHRASE;
            const claUrl = `https://github.com/${owner}/${repo}/blob/${context.payload.repository.default_branch}/docs/contributors/CLA.md`;

            async function readSignatures() {
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path: FILE, ref: BRANCH });
                return { sha: data.sha, list: JSON.parse(Buffer.from(data.content, 'base64').toString()).signatures };
              } catch (e) {
                if (e.status === 404) return { sha: null, list: [] };
                throw e;
              }
            }

            async function branchExists() {
              try {
                await github.rest.repos.getBranch({ owner, repo, branch: BRANCH });
                return true;
              } catch (e) {
                if (e.status === 404) return false;
                throw e;
              }
            }

            async function writeSignatures(content, sha, login) {
              const message = `Record ${login}'s CLA signature`;
              if (sha || (await branchExists())) {
                await github.rest.repos.createOrUpdateFileContents({
                  owner, repo, path: FILE, branch: BRANCH, message,
                  content: Buffer.from(content).toString('base64'),
                  ...(sha ? { sha } : {}),
                });
                return;
              }
              // The first signature starts the branch with no history, so it holds only the record.
              const { data: tree } = await github.rest.git.createTree({
                owner, repo, tree: [{ path: FILE, mode: '100644', type: 'blob', content }],
              });
              const { data: commit } = await github.rest.git.createCommit({ owner, repo, message, tree: tree.sha, parents: [] });
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${BRANCH}`, sha: commit.sha });
            }

            async function recordSignature(user, number) {
              const { data: cla } = await github.rest.repos.getContent({ owner, repo, path: 'docs/contributors/CLA.md' });
              for (let attempt = 0; attempt < 5; attempt++) {
                const { sha, list } = await readSignatures();
                if (list.some((s) => s.id === user.id)) return;
                list.push({ login: user.login, id: user.id, signed_at: new Date().toISOString(), pull_request: number, cla: cla.sha });
                try {
                  await writeSignatures(JSON.stringify({ signatures: list }, null, 2) + '\n', sha, user.login);
                  return;
                } catch (e) {
                  // Another run wrote the file or created the branch first: read it again and retry.
                  if (e.status !== 409 && e.status !== 422) throw e;
                }
              }
              throw new Error(`could not record ${user.login}'s signature after 5 attempts`);
            }

            async function verdict(number) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              const people = new Map();
              const unlinked = new Set();
              const add = (u) => { if (u && u.login !== 'web-flow') people.set(u.id, u.login); };
              add(pr.user);
              const commits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number: number, per_page: 100 });
              for (const c of commits) {
                if (c.author) add(c.author);
                else unlinked.add(`${c.commit.author.name} <${c.commit.author.email}>`);
                add(c.committer);
              }
              const signed = new Set((await readSignatures()).list.map((s) => s.id));
              const unsigned = [...people]
                .filter(([id, login]) => !exempt.has(login.toLowerCase()) && !signed.has(id))
                .map(([, login]) => login);
              return { pr, unsigned, unlinked: [...unlinked], tooMany: commits.length >= MAX_COMMITS };
            }

            async function report(number) {
              const { pr, unsigned, unlinked, tooMany } = await verdict(number);
              const ok = unsigned.length === 0 && unlinked.length === 0 && !tooMany;
              const description = ok
                ? 'Everyone who must sign the CLA has signed it.'
                : tooMany ? 'Too many commits to check.'
                : unsigned.length ? `Not signed yet: ${unsigned.join(', ')}`
                : 'Some commit authors have no GitHub account.';
              await github.rest.repos.createCommitStatus({
                owner, repo, sha: pr.head.sha, state: ok ? 'success' : 'failure', context: 'cla',
                description: description.slice(0, 140), target_url: claUrl,
              });

              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
              const mine = comments.find((c) => c.user.login === 'github-actions[bot]' && c.body.startsWith(MARKER));
              if (ok && !mine) return;
              const lines = [MARKER];
              if (ok) {
                lines.push('Everyone who must sign the CLA has signed it. Thank you.');
              } else {
                lines.push(`Before this pull request can be merged, everyone who submits work to it signs Orrery's [Contributor License Agreement](${claUrl}).`);
                if (unsigned.length) {
                  lines.push('', 'Still to sign:', '', ...unsigned.map((login) => `- @${login}`));
                  lines.push('', 'To sign, read the agreement, then comment on this pull request with exactly:', '', '```', phrase, '```', '', 'One signature covers all your pull requests.');
                }
                if (unlinked.length) {
                  lines.push('', "These commit authors aren't linked to a GitHub account, so nobody can sign for them. Re-author the commits with an email address your GitHub account has verified:", '', ...unlinked.map((a) => `- ${a}`));
                }
                if (tooMany) {
                  lines.push('', `This pull request has ${MAX_COMMITS} or more commits, more than the check can read. Squash it into fewer.`);
                }
              }
              const body = lines.join('\n');
              if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
              else await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            }

            if (context.eventName === 'issue_comment') {
              const { comment, issue } = context.payload;
              const said = comment.body.trim().replace(/\.$/, '').toLowerCase();
              if (said === phrase.toLowerCase() && comment.user.type !== 'Bot') {
                await recordSignature(comment.user, issue.number);
              } else if (said !== 'recheck') {
                return;
              }
              await report(issue.number);
            } else {
              await report(context.payload.pull_request.number);
            }

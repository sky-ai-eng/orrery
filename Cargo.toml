[workspace]
resolver = "3"
members = [
    "crates/orrery-world",
    "crates/orrery-face-git",
    "crates/orrery-face-github",
    "crates/orrery-snapshot",
    "crates/orrery-server",
    "crates/orrery-outbound",
    "crates/orrery",
    "crates/orrery-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
publish = false
repository = "https://github.com/sky-ai-eng/orrery"

[workspace.dependencies]
orrery-world = { path = "crates/orrery-world" }
orrery-face-git = { path = "crates/orrery-face-git" }
orrery-face-github = { path = "crates/orrery-face-github" }
orrery-snapshot = { path = "crates/orrery-snapshot" }
orrery-server = { path = "crates/orrery-server" }
orrery-outbound = { path = "crates/orrery-outbound" }

anyhow = "1"
async-graphql = { version = "7", default-features = false }
axum = "0.8"
base64 = "0.22"
boon = "0.6"
clap = { version = "4", features = ["derive", "env"] }
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false }
getrandom = "0.4"
hex = "0.4"
hmac = "0.12"
httparse = "1"
jiff = "0.2"
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
# Checks the signature on a GitHub App's JWT. rustls already brings it in.
ring = "0.17"
# ring alone, as ureq uses it: the default would add a second crypto provider.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "process",
    "io-util",
    "sync",
    "signal",
] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# No gzip: a webhook delivery keeps the answer's body as the receiver sent it.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
webpki-roots = "1"

# dev
rcgen = "0.14"
syn = { version = "2", features = ["full", "visit"] }
tempfile = "3"

[workspace.lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"

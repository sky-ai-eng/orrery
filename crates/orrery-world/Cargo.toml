[package]
name = "orrery-world"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
description = "Orrery's world kernel: world-root layout, SQLite state, the virtual clock, actors, and the append-only action log"

[features]
# For tests: runs the completeness audit on every write, which fails a write
# that stores a value none of its events carries (src/audit.rs), and exposes
# `test_support`, which lets another crate's tests append migrations.
test-support = []

[dependencies]
hex.workspace = true
hmac.workspace = true
jiff.workspace = true
rusqlite.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The crate's own integration tests run with the audit too.
orrery-world = { path = ".", features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true

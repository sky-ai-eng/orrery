# An Orrery instance is one config file plus one seed (spec/README.md rule 7).
# Unknown keys are rejected, not ignored.

[instance]
# Directory holding this instance's world/ (and, later, snapshots/).
dir = "./instance"
# RFC3339 T0 for a newly created world. Ignored when the world already exists —
# the clock lives in the world, not the config. Omit for the fixed default
# (2020-01-01T00:00:00Z).
t0 = "2026-01-01T00:00:00Z"
# How a newly created world's clock moves. "manual" moves only by
# POST /_orrery/clock/advance, so two runs of one script make the same log.
# "real" follows the host's time, for a world standing in for GitHub in front
# of a running application that compares the times the world stamps with its
# own clock. A real world's clock starts at the host's time, so t0 with
# "real" is refused. Ignored when the world already exists: the mode lives in
# the world, and PATCH /_orrery/clock changes it.
# clock = "manual"
# The secret a newly created world derives its fake credentials from. "local"
# is a fixed, well-known one, so local runs mint the same tokens every time;
# "random" makes them unguessable, as a world on the public internet needs.
# Ignored when the world already exists — the secret lives in the world.
# secret = "local"

[server]
# host:port; unix:/absolute/path for a Unix socket; or fd:<name> for a
# listening Unix socket a supervisor passed in, as systemd's socket activation
# passes one (sd_listen_fds(3)). A stale socket file left at a unix: path is
# removed before binding. Port 0, as in "127.0.0.1:0", picks a free port.
#
# fd:<name> takes descriptor 3 + i, where i is <name>'s place in LISTEN_FDNAMES,
# when LISTEN_PID is this process and i is less than LISTEN_FDS. <name> is 1 to
# 255 characters, with no ":" and no control characters, and must appear in
# LISTEN_FDNAMES once. The descriptor must be a listening Unix stream socket
# bound to an absolute path; anything else stops `orrery serve` before it is
# ready. Its file is never bound, removed, or replaced: the supervisor made it,
# and removes it. The socket stays open in the supervisor when the world stops,
# so a connection made while no `orrery serve` runs waits for the next one.
#
# Once it is ready to serve, `orrery serve` prints one line of JSON to stdout
# naming its addresses, the real port included, and a passed socket as
# unix:<its path>:
#   {"base_url":"http://127.0.0.1:43211","listen":"127.0.0.1:43211","control":"127.0.0.1:43211"}
# Nothing else goes to stdout; logs go to stderr.
listen = "127.0.0.1:4180"
# External base URL rendered into clone/html URLs; defaults to http://<listen>.
# Required when listen is a socket.
# base_url = "http://127.0.0.1:4180"
# Serve the control plane (/_orrery/*) only here, in listen's syntax; listen
# then answers /_orrery/* as unmocked surface. Omit to keep it on listen. As
# fd:<name>, it must name a different passed socket from listen's.
# control_listen = "unix:/run/orrery/control.sock"
# Clone and fetch without a token, as GitHub allows for public repos. A world
# whose faces are on the public internet sets this to false.
# anonymous_git_reads = true

[outbound]
# How a world sends its webhook deliveries, the one thing a world sends: one
# POST to a receiver's URL, given 10 seconds, never retried and never
# redirected (spec/usage.md, "What a world sends"). The GitHub face sends no
# deliveries yet.
#
# How the connection leaves this machine. "direct" looks up the receiver's
# host name and connects to it. Anything else is the address of an HTTP
# CONNECT proxy, as an IP address and port (127.0.0.1:3128) or
# unix:/absolute/path: the engine asks the proxy for a tunnel to the
# receiver's host name and port, and the proxy looks the name up, so it can
# refuse an address. A supervisor that runs a world with no network of its own
# gives it egress this way. The proxy is reached only when there is something
# to send.
egress = "direct"
# A PEM file of certificate authorities to trust as well as the public root
# certificates the binary ships, such as the one that issued a local
# receiver's self-signed certificate. A file that can't be read, or that holds
# no certificate, stops `orrery serve` before it opens the world.
# extra_ca_certs = "./receiver-ca.pem"
